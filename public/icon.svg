<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ink" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#1e2c42"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#efd68a"/>
      <stop offset="55%" stop-color="#d9b45c"/>
      <stop offset="100%" stop-color="#b8933f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9b45c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d9b45c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 墨晕圆 + 金圈 -->
  <circle cx="32" cy="32" r="31" fill="url(#ink)"/>
  <circle cx="32" cy="32" r="31" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="29.4" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>

  <!-- 飘逸仙字 -->
  <text x="32" y="46.5" text-anchor="middle" font-size="44" fill="url(#gold)" filter="url(#glow)"
        font-family="STXingkai, '华文行楷', KaiTi, '楷体', STKaiti, serif">仙</text>

  <!-- 底部淡墨山影 -->
  <path d="M5 50 Q15 40 24 45 Q33 37 43 43 Q51 38 59 42 L59 52 L5 52 Z" fill="#121a26" opacity="0.5"/>
</svg>
